name: yoga_guru
description: "Yoga Guru - a yoga instructor app with guided sessions, a pose library, progress tracking and local storage."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  camera: ^0.12.1
  google_mlkit_pose_detection: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/poses/
